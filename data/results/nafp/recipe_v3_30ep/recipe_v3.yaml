  TR_N_ANCHOR: 160
  VAL_BATCH_SZ: 120
  VAL_N_ANCHOR: 60
  TS_BATCH_SZ: 125
TRAIN:
  MAX_EPOCH: 30
  OPTIMIZER: Adam
