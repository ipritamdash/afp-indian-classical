  TR_SEG_MODE: random_oneshot
  TEST_DUMMY_DB: 10k_full
  TEST_QUERY_DB: unseen_icassp
  REDUCE_ITEMS_P: 0
MODEL:
  FEAT: melspec
  FS: 8000
  DUR: 1.0
  HOP: 0.5
  STFT_WIN: 1024
  STFT_HOP: 256
  F_MIN: 160.0
  F_MAX: 4000.0
  N_MELS: 256
  EMB_SZ: 128
  BN: layer_norm2d
BSZ:
