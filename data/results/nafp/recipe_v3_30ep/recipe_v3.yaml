  LR_SCHEDULE: cos
  CHECKPOINT_KEEP_N_HOUR: 1
  TENSORBOARD: true
  SAVE_IMG: true
  MINI_TEST_IN_TRAIN: false
LOSS:
  LOSS_MODE: NTxent
  TAU: 0.05
  MARGIN: 0.5
TD_AUG:
  TR_SNR:
  - 0
  - 10
  TS_SNR:
  - 0
  - 10
  VAL_SNR:
  - 0
  - 10
  TR_SPEECH_AUG: false
  TS_SPEECH_AUG: false
  VAL_SPEECH_AUG: false
  TR_BG_AUG: true
  TS_BG_AUG: true
  VAL_BG_AUG: true
  TR_IR_AUG: true
  TS_IR_AUG: true
  VAL_IR_AUG: true
SPEC_AUG:
  SPECAUG_CHAIN:
  - cutout
  - horizontal
  SPECAUG_PROBS: 1.0
  SPECAUG_N_HOLES: 1
  SPECAUG_HOLE_FILL: zeros
DEVICE:
  CPU_N_WORKERS: 4
  CPU_MAX_QUEUE: 10
