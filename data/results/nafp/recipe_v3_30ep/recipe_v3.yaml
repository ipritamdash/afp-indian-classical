DIR:
  SOURCE_ROOT_DIR: /content/data/neural-audio-fp-dataset/music/
  BG_ROOT_DIR: /content/data/neural-audio-fp-dataset/aug/bg/
  IR_ROOT_DIR: /content/data/neural-audio-fp-dataset/aug/ir/
  SPEECH_ROOT_DIR: /content/data/neural-audio-fp-dataset/aug/speech/common_voice_8k/en/
  OUTPUT_ROOT_DIR: /content/logs/emb/
  LOG_ROOT_DIR: /content/logs/
DATA_SEL:
